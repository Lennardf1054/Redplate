<div class="card" style="margin-top: 16px;">
  <h3>My orders</h3>

  {% if my_orders %}
    {% for order in my_orders %}
      <div class="order-line">
        <a href="/order/{{ order.order_no }}"><strong>#{{ order.order_no }}</strong></a>
        <span class="pill">{{ order.status }}</span><br>
        <small>{{ order.shop_name }}: {{ order.items_text }}</small>
      </div>
    {% endfor %}
  {% else %}
    <p>No orders yet.</p>
  {% endif %}
</div>
