{% extends "base.html" %}
{% block title %}Menu - QuickServe{% endblock %}

{% block nav %}
  <div class="inline-nav">
    <a href="/menu">Menu</a>
    <a href="/cart">Cart</a>
  </div>
{% endblock %}

{% block content %}
  <h2>Our Menu</h2>
  <input type="search" placeholder="Search food..." style="margin-bottom: 20px;">

  <div class="menu-grid">
    {% for item in items %}
      <div class="menu-item">
        <strong>{{ item.name }}</strong>
        <span class="price">₱{{ item.price }}</span>
        {% if item.stock > 0 %}
          <button>Add to Cart</button>
        {% else %}
          <span class="pill urgent">Out of stock</span>
        {% endif %}
      </div>
    {% endfor %}
  </div>
{% endblock %}
