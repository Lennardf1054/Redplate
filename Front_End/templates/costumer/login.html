{% extends "base.html" %}
{% block title %}Login - QuickServe{% endblock %}

{% block content %}
  <div class="card" style="max-width: 400px; margin: 60px auto;">
    <h2>Welcome back</h2>
    <form action="/login" method="post">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" style="width: 100%;">Log in</button>
    </form>

    <!-- TEMPORARY: remove when real login is built -->
    <form action="/menu" method="get" style="margin-top: 10px;">
      <button type="submit" class="secondary" style="width: 100%;">[TEMP] Go to Menu</button>
    </form>

    <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border);">

    <p style="text-align: center; font-size: 0.9rem; margin: 0;">
      <a href="/admin/login" style="color: var(--primary);">Admin login →</a>
    </p>
  </div>
{% endblock %}
