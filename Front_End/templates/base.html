<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Redplate{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <!-- <img src="images/website_test_image.png" height="200px" width="300px"> -->
   <!-- <img src="{{ url_for('static', filename='website_test_image.png') }}" height="200" width="300"> -->
  <header class="topbar">
    <a href="/" class="brand">Redplate</a>
    {% block nav %}{% endblock %}
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='logic.js') }}" defer></script>
</body>
</html>
